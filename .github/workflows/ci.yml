name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest pytest-cov

      - name: Compile check
        run: python -m compileall -q -x '(^|/)(__pycache__|archive)/' .

      - name: Ruff F821 (undefined names)
        run: python -m ruff check --select F821 deletion_gate.py models.py grouping.py clustering.py scoring.py file_utils.py

      - name: Bandit (high)
        run: bandit --severity-level high deletion_gate.py models.py grouping.py clustering.py scoring.py file_utils.py

      - name: Pytest
        run: python -m pytest -q --cov-report=xml --cov=deletion_gate --cov=models

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
